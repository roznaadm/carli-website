<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Carli Susanto - Content Creator, Web3 & Crypto">
<title>Carli Susanto</title>

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --text: #ffffff;
  --muted: #cbd5e1;
  --border: rgba(255,255,255,.08);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 1200px;
  margin: auto;
  padding: 30px 20px 80px;
}

/* HEADER */
.header {
  text-align: center;
  padding: 20px 0 10px;
}

.profile {
  width: 110px;
  height: 110px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,.15);
}

.header h1 {
  margin: 15px 0 6px;
  font-size: 32px;
}

.header p {
  margin: 0;
  color: var(--muted);
}

/* LINKS */
.links {
  text-align: center;
  margin: 22px 0 35px;
}

.links a {
  display: inline-block;
  margin: 6px;
  padding: 10px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  text-decoration: none;
  color: var(--text);
  transition: .25s;
}

.links a:hover {
  transform: translateY(-2px) scale(1.03);
}

.links a img {
  vertical-align: middle;
  margin-right: 6px;
  filter: invert(1);
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

.column {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.column h3 {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card {
  background: var(--card);
  padding: 10px;
  border-radius: 12px;
  border: 1px solid var(--border);
  overflow: hidden;
}

/* SHORTS */
iframe.shorts {
  width: 100%;
  aspect-ratio: 9 / 16;
  border-radius: 10px;
  border: none;
  display: block;
}

/* WIDGETS */
.sk-tiktok-feed,
.sk-ww-twitter-feed,
.sk-ww-youtube-channel-videos {
  border-radius: 12px;
  overflow: hidden;
}

/* COUNTER */
.counter-box {
  position: fixed;
  bottom: 15px;
  right: 15px;
  background: var(--card);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 14px;
  opacity: .95;
  border: 1px solid var(--border);
  box-shadow: 0 5px 25px rgba(0,0,0,.25);
  z-index: 9999;
}

/* FOOTER */
.footer {
  text-align: center;
  margin-top: 45px;
  color: var(--muted);
  font-size: 13px;
}

/* MOBILE */
@media (max-width: 900px) {
  .grid {
    grid-template-columns: 1fr;
  }

  .header h1 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->
  <div class="header">
    <img
      class="profile"
      src="https://pbs.twimg.com/profile_images/1879046675286941697/oV-q5rRK_400x400.jpg"
      alt="Carli Susanto">

    <h1>Carli Susanto</h1>
    <p>Content Creator | Web3 | Crypto</p>
  </div>

  <!-- SOCIAL LINKS -->
  <div class="links">

    <a href="https://www.tiktok.com/@carli.eth" target="_blank" rel="noopener noreferrer">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg" width="16" alt="">
      TikTok
    </a>

    <a href="https://www.youtube.com/channel/UCn1soEkkJgdDe8gYf-KVXzA" target="_blank" rel="noopener noreferrer">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" width="16" alt="">
      YouTube
    </a>

    <a href="https://x.com/CharlieAkatsuki" target="_blank" rel="noopener noreferrer">
      <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg" width="16" alt="">
      X
    </a>

  </div>

  <!-- CONTENT GRID -->
  <div class="grid">

    <!-- TIKTOK -->
    <div class="column">
      <h3>
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/tiktok.svg"
             width="18" alt="" style="filter:invert(1);">
        TikTok
      </h3>

      <div class="card">
        <div class="sk-tiktok-feed" data-embed-id="25672206"></div>
      </div>
    </div>

    <!-- YOUTUBE -->
    <div class="column">
      <h3>
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg"
             width="18" alt="" style="filter:invert(1);">
        YouTube
      </h3>

      <div class="card">
        <iframe
          class="shorts"
          src="https://www.youtube.com/embed/KOzxIEziy9E"
          title="YouTube Shorts"
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>

      <div class="card">
        <div class="sk-ww-youtube-channel-videos" data-embed-id="25678162"></div>
      </div>
    </div>

    <!-- X -->
    <div class="column">
      <h3>
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/x.svg"
             width="18" alt="" style="filter:invert(1);">
        X
      </h3>

      <div class="card">
        <div class="sk-ww-twitter-feed" data-embed-id="25672207"></div>
      </div>
    </div>

  </div>

  <div class="footer">
    © 2026 Carli Susanto
  </div>

</div>

<!-- VISITOR COUNTER -->
<div id="counter" class="counter-box">
  👀 Visitors: loading...
</div>

<!-- SOCIABLEKIT -->
<script src="https://widgets.sociablekit.com/tiktok-feed/widget.js" defer></script>
<script src="https://widgets.sociablekit.com/twitter-feed/widget.js" defer></script>
<script src="https://widgets.sociablekit.com/youtube-channel-videos/widget.js" defer></script>

<!-- VISITOR COUNTER -->
<script>
const counterEl = document.getElementById("counter");

/*
 * Counter khusus untuk carlisusanto.com.
 * Tidak lagi memakai namespace carlisusanto.me.
 */
fetch("https://api.countapi.xyz/hit/carlisusanto.com/visits")
  .then(res => res.json())
  .then(data => {
    counterEl.innerText = "👀 Visitors: " + data.value;
  })
  .catch(() => {
    counterEl.style.display = "none";
  });
</script>

</body>
</html>
